<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wordbridge 字橋</title>
  <meta name="description" content="English ⇄ Traditional Chinese dictionary that works offline. 英漢（繁體）雙向離線詞典。">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="字橋">
  <script>
    // Apply the saved theme before first paint to avoid a flash. Android takes the
    // system navigation bar color from theme-color, so set it to match too.
    try {
      var th = localStorage.getItem('wb.theme');
      if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
      var dark = th === 'dark' || (th !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.querySelector('meta[name="theme-color"]').content = '#0d1020';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="is-home">
  <header class="topbar">
    <a class="brand" href="#/">
      <img src="icons/icon.svg" alt="" width="30" height="30">
      <span data-i18n="appName">Wordbridge</span>
    </a>
    <span class="net-pill" id="netPill" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>
      <span data-i18n="offline">Offline</span>
    </span>
    <div class="actions">
      <button type="button" id="installBtn" class="install-btn" hidden data-i18n-label="installApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M12 8v6m-3-3h6"/></svg>
        <span data-i18n="install">Install</span>
      </button>
      <button type="button" id="langBtn" class="icon-btn lang-btn" data-i18n-label="switchLanguage">
        <span id="langLabel">中</span>
      </button>
      <button type="button" id="themeBtn" class="icon-btn" data-i18n-label="theme">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-system"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" class="fill"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-light"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-dark"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
      </button>
      <button type="button" id="settingsBtn" class="icon-btn" data-i18n-label="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero" aria-hidden="true">
      <img class="hero-logo" src="icons/icon.svg" alt="" width="112" height="112">
      <h1 data-i18n="appName">Wordbridge</h1>
      <p data-i18n="tagline">English ⇄ Traditional Chinese dictionary</p>
    </section>

    <div class="search-wrap">
      <form id="searchForm" role="search" autocomplete="off">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="search-ic"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" name="q" role="combobox" aria-autocomplete="list" aria-expanded="false"
                 aria-controls="suggestions" autocapitalize="off" autocorrect="off" spellcheck="false"
                 enterkeyhint="search" data-i18n-placeholder="searchPlaceholder" data-i18n-label="search">
          <button type="button" id="clearBtn" class="icon-btn small" hidden data-i18n-label="clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </form>
    </div>

    <section id="homeView" class="home">
      <div id="homeError" class="card notice" hidden></div>
      <div id="wotd" class="card wotd" hidden></div>
      <div id="recentBlock" hidden>
        <div class="section-head">
          <h2 data-i18n="recent">Recent searches</h2>
          <button type="button" id="clearRecent" class="link-btn" data-i18n="clearHistory">Clear</button>
        </div>
        <div id="recentList" class="chips"></div>
      </div>
      <div id="offlineCta" class="card cta" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="cta-ic"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <div>
          <strong data-i18n="getOffline">Use it offline</strong>
          <p data-i18n="getOfflineDesc"></p>
        </div>
        <button type="button" id="ctaBtn" class="btn primary" data-i18n="download">Download</button>
      </div>
    </section>

    <section id="resultView" class="results" hidden aria-live="polite"></section>
  </main>

  <dialog id="settings" class="sheet" aria-labelledby="settingsTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
        <button class="icon-btn" value="close" data-i18n-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <section class="setting">
        <h3 data-i18n="language">Language</h3>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="lang" value="system"><span data-i18n="system">System</span></label>
          <label><input type="radio" name="lang" value="en"><span>English</span></label>
          <label><input type="radio" name="lang" value="zh-Hant"><span>繁體中文</span></label>
        </div>
      </section>

      <section class="setting">
        <h3 data-i18n="theme">Theme</h3>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="theme" value="system"><span data-i18n="system">System</span></label>
          <label><input type="radio" name="theme" value="light"><span data-i18n="light">Light</span></label>
          <label><input type="radio" name="theme" value="dark"><span data-i18n="dark">Dark</span></label>
        </div>
      </section>

      <section class="setting">
        <h3 data-i18n="pronunciation">Pronunciation</h3>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="voice" value="female"><span data-i18n="voiceFemale">Female</span></label>
          <label><input type="radio" name="voice" value="male"><span data-i18n="voiceMale">Male</span></label>
        </div>
        <div id="voiceInfo" class="voice-info"></div>
        <div class="row-btns" id="voiceTest">
          <button type="button" id="voiceTestUK" class="btn ghost"><span class="accent uk" data-i18n="uk">UK</span><span data-i18n="voiceTest">Test</span></button>
          <button type="button" id="voiceTestUS" class="btn ghost"><span class="accent us" data-i18n="us">US</span><span data-i18n="voiceTest">Test</span></button>
        </div>
      </section>

      <section class="setting">
        <h3 data-i18n="app">App</h3>
        <p id="installStatus" class="status-line"></p>
        <div class="row-btns">
          <button type="button" id="installBtn2" class="btn primary" data-i18n="installApp" hidden>Install app</button>
        </div>
      </section>

      <section class="setting">
        <h3 data-i18n="offlineData">Offline dictionary</h3>
        <p id="offlineStatus" class="status-line"></p>
        <div id="progress" class="progress" hidden><div class="bar"></div></div>
        <div class="row-btns">
          <button type="button" id="dlBtn" class="btn primary" data-i18n="download">Download</button>
          <button type="button" id="rmBtn" class="btn ghost danger" data-i18n="remove" hidden>Remove offline data</button>
        </div>
        <p id="storageInfo" class="muted small"></p>
      </section>

      <section class="setting">
        <h3 data-i18n="about">About</h3>
        <p class="small" data-i18n="aboutText"></p>
        <p id="dataVersion" class="muted small"></p>
      </section>
    </form>
  </dialog>

  <dialog id="installHelp" class="sheet" aria-labelledby="installHelpTitle">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 id="installHelpTitle" data-i18n="installApp">Install app</h2>
        <button class="icon-btn" value="close" data-i18n-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="install-hero">
        <img src="icons/icon.svg" alt="" width="64" height="64">
        <p data-i18n="installWhy"></p>
      </div>
      <ol id="installSteps" class="steps"></ol>
      <button class="btn primary wide" value="close" data-i18n="gotIt">Got it</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
