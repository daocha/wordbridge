# Serves the app both at the root (http://<ip>:<port>/) and under /dict/
# (e.g. https://example.com/dict/ behind a reverse proxy that keeps the prefix).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    absolute_redirect off;
    charset utf-8;
    server_tokens off;

    # access_log on/off, written from LOG_LEVEL by docker/40-log-level.sh
    include /etc/nginx/snippets/access_log.conf;

    gzip on;
    gzip_static on;          # use the pre-compressed data/*.json.gz files
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # /dict/... maps onto the same files as /...
    location = /dict { return 301 /dict/; }
    location ^~ /dict/ {
        rewrite ^/dict/(.*)$ /$1 last;
    }

    # Always revalidate the app shell so updates show up immediately.
    location ~ (^/$|\.html$|/sw\.js$) {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Fingerprinted assets (name.<hash>.js/css): content never changes for a URL.
    location ~ "\.[0-9a-f]{8}\.(css|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /data/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
